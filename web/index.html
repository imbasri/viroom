<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViRoom — Office Live</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="ws-dot"></span>
      <h1>ViRoom — Office Live</h1>
      <span id="ws-state" style="color:var(--dim);font-size:12px">connecting…</span>
    </header>
    <main>
      <div class="toolbar">
        <button id="btn-2d" aria-pressed="true">2D pixel</button>
        <button id="btn-3d" aria-pressed="false">3D</button>
        <label>n <input id="n-input" type="number" min="1" max="24" value="12" /></label>
        <button id="btn-apply">Apply</button>
      </div>
      <div class="stage">
        <canvas id="scene" width="960" height="540"></canvas>
      </div>
      <div id="fallback-note"></div>
      <div class="legend">
        <span class="d">desk</span>
        <span class="m">meeting</span>
        <span class="l">lounge</span>
        <span class="a">away</span>
      </div>
    </main>
    <script type="importmap">
      { "imports": { "three": "/web/vendor/three.module.js" } }
    </script>
    <script type="module" src="/web/dist/web/app.js"></script>
  </body>
</html>
