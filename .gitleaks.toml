title = "viroom gitleaks config"

[allowlist]
  description = "allowed paths (lockfiles, not secret patterns)"
  paths = [
    'bun\.lock$',
    'package-lock\.json$',
    'node_modules/'
  ]

[[rules]]
  id = "aws-access-key"
  description = "AWS access key"
  regex = '(A3T[A-Z0-9]|AKIA|ASIA)[A-Z0-9]{16}'
  tags = ['key', 'aws']

[[rules]]
  id = "openai-api-key"
  description = "OpenAI / LLM-style API key"
  regex = 'sk-[A-Za-z0-9]{20,}'
  tags = ['key']

[[rules]]
  id = "generic-private-key"
  description = "PEM private key block"
  regex = '(?i)-----BEGIN[ A-Z]*PRIVATE KEY-----'
  tags = ['key']

[[rules]]
  id = "telegram-bot-token"
  description = "Telegram bot token"
  regex = '\d{8,10}:[A-Za-z0-9_-]{35}'
  tags = ['key']

[[rules]]
  id = "slack-token"
  description = "Slack token"
  regex = 'xox[baprs]-[A-Za-z0-9-]{10,}'
  tags = ['key']

[[rules]]
  id = "github-token"
  description = "GitHub token"
  regex = 'gh[pousr]_[-a-zA-Z0-9]{20,}'
  tags = ['key']
